[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
sokkel-tui = { path = "crates/core" }
ratatui = "0.30"
serde_json = { version = "1", features = ["preserve_order"] }
